<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200, initial-scale=1"><title>How to choose the right RevOps tool</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:1400px;overflow:hidden}body{background:#151713;color:#f7f3e8;font-family:Inter,system-ui,-apple-system,sans-serif}.canvas{position:relative;width:1200px;height:1400px;padding:90px 88px;overflow:hidden}.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#a8b3a1 1px,transparent 1px),linear-gradient(90deg,#a8b3a1 1px,transparent 1px);background-size:72px 72px}.content{position:relative;z-index:1}h1{margin:28px 0 24px;max-width:960px;font-size:91px;line-height:.93;letter-spacing:-.065em}.roadmap{position:relative;margin-top:70px;height:650px}.line{position:absolute;left:70px;right:70px;top:290px;height:5px;background:#596055}.progress{position:absolute;left:70px;width:calc(100% - 140px);top:290px;height:5px;background:#b8f06a;transform:scaleX(0);transform-origin:left;animation:grow 5s cubic-bezier(.65,0,.35,1) infinite}.steps{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.step{position:relative;text-align:center;opacity:.3;animation:activate 5s ease infinite}.step:nth-child(1){animation-delay:0s}.step:nth-child(2){animation-delay:1s}.step:nth-child(3){animation-delay:2s}.step:nth-child(4){animation-delay:3s}.step:nth-child(5){animation-delay:4s}.step:nth-child(odd){padding-top:145px}.step:nth-child(even){padding-top:340px}.dot{position:absolute;top:267px;left:50%;width:52px;height:52px;transform:translateX(-50%) scale(.72);border-radius:50%;border:5px solid #151713;background:#151713;box-shadow:0 0 0 3px #b8f06a;animation:pulse 5s ease infinite}.step:nth-child(1) .dot{animation-delay:0s}.step:nth-child(2) .dot{animation-delay:1s}.step:nth-child(3) .dot{animation-delay:2s}.step:nth-child(4) .dot{animation-delay:3s}.step:nth-child(5) .dot{animation-delay:4s}.n{color:#b8f06a;font-size:18px;font-weight:900;letter-spacing:.12em}h2{margin:13px auto 0;font-size:28px;line-height:1.02;letter-spacing:-.035em;max-width:185px}@keyframes grow{0%{transform:sca
